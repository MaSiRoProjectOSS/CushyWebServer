; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
#default_envs = web_m5stack_atom
src_dir = ./

[env]
monitor_speed = 115200
lib_deps =
	ESP32Async/ESPAsyncWebServer@^3.11.2
	ayushsharma82/ElegantOTA@^3.1.7
	bblanchon/ArduinoJson@^7.4.3
lib_compat_mode = strict
lib_ldf_mode = chain
build_flags =
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-D FEATURES_FILE_ENABLE_ENCRYPTION=1
	-D FEATURES_WIFI_STORAGE_SPIFFS=1
	-D FEATURES_SNTP_ENABLE=1
	-D FEATURES_CUSHY_WEB_SERVER_OTA=1
	-D SETTING_WIFI_STORAGE_OVERRIDE=0
	-D SETTING_DEFAULT_FAVICON=1
	-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
	-D SETTING_WIFI_STA_DEFAULT_ENABLE=false
	-D SETTING_WIFI_STA_DEFAULT_SSID="\"CushyWebServerSTA\""
	-D SETTING_WIFI_STA_DEFAULT_PASSWORD="\"password!\""
	-D SETTING_WIFI_AP_DEFAULT_ENABLE=true
	-D SETTING_WIFI_AP_DEFAULT_SSID="\"CushyWebServerAP\""
	-D SETTING_WIFI_AP_DEFAULT_PASSWORD="\"password!\""
build_src_filter =
	+<src/>
	-<.git/>
	-<.github/>
	-<.pio/>
	-<.svn/>
	-<.vscode/>
	-<data/>
	-<doxygen/>
	-<test/>
	+<examples/basic>
	-<examples/standard>
	-<examples/advance>
check_tool = cppcheck, clangtidy
check_flags = --enable=all
platform_packages = tool-cppcheck
check_src_filters =
	+<src/>
	+<include/>
	+<examples/>
	-<.git/>
	-<.svn/>
	-<.pio/>
	-<.vscode/>
	-<data/>
	-<doxygen/>
	-<test/>

[env:web_m5stack_atom]
framework = arduino
platform = espressif32
board = m5stack-atom
lib_deps =
	${env.lib_deps}
	m5stack/M5Atom@^0.1.3
	fastled/FastLED@^3.10.3

[env:web_m5stack_atomS3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps =
	${env.lib_deps}
	m5stack/M5AtomS3@^1.0.2
	m5stack/M5Unified@^0.2.17
	fastled/FastLED@^3.10.3

[env:web_m5stack_core_esp32]
framework = arduino
platform = espressif32
board = m5stack-core-esp32
lib_deps =
	${env.lib_deps}
	m5stack/M5Atom@^0.1.3
	fastled/FastLED@^3.10.3
